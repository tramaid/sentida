<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <path id="sealTextPath" d="M 80, 80 m -62, 0 a 62,62 0 1,1 124,0 a 62,62 0 1,1 -124,0" fill="none" />
    <path id="sealInnerPath" d="M 80, 80 m -44, 0 a 44,44 0 1,1 88,0 a 44,44 0 1,1 -88,0" fill="none" />
  </defs>

  <!-- Background disk -->
  <circle cx="80" cy="80" r="77" fill="#F8EADE" stroke="#CFB59E" stroke-width="1.2" />
  <circle cx="80" cy="80" r="71" fill="none" stroke="#8FB1C9" stroke-width="0.8" stroke-dasharray="2.5 2.5" />
  <circle cx="80" cy="80" r="50" fill="none" stroke="#CFB59E" stroke-width="0.8" />

  <!-- Circular Text along path -->
  <text font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#402D21" letter-spacing="2.6">
    <textPath href="#sealTextPath" startOffset="0%">
      SENTIDA PASTELERÍA · SAN ISIDRO · HECHO A MANO ·
    </textPath>
  </text>

  <!-- Center Botanical Illustration: Edible Flower Petals -->
  <g transform="translate(80,80) scale(0.9)">
    <!-- 6 Petals -->
    <path d="M0 -22 C-5 -13 -7 -5 0 0 C7 -5 5 -13 0 -22 Z" fill="#402D21" opacity="0.9" />
    <path d="M0 -22 C-5 -13 -7 -5 0 0 C7 -5 5 -13 0 -22 Z" fill="#402D21" opacity="0.9" transform="rotate(60)" />
    <path d="M0 -22 C-5 -13 -7 -5 0 0 C7 -5 5 -13 0 -22 Z" fill="#402D21" opacity="0.9" transform="rotate(120)" />
    <path d="M0 -22 C-5 -13 -7 -5 0 0 C7 -5 5 -13 0 -22 Z" fill="#402D21" opacity="0.9" transform="rotate(180)" />
    <path d="M0 -22 C-5 -13 -7 -5 0 0 C7 -5 5 -13 0 -22 Z" fill="#402D21" opacity="0.9" transform="rotate(240)" />
    <path d="M0 -22 C-5 -13 -7 -5 0 0 C7 -5 5 -13 0 -22 Z" fill="#402D21" opacity="0.9" transform="rotate(300)" />
    <circle cx="0" cy="0" r="4" fill="#F8EADE" stroke="#402D21" stroke-width="1.2" />
    <circle cx="0" cy="0" r="1.5" fill="#402D21" />
  </g>

  <!-- Subtle subtitle in center -->
  <text x="80" y="108" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" letter-spacing="1.5" fill="#6C4D38" text-anchor="middle">
    ANTO &amp; NADIA
  </text>
</svg>
